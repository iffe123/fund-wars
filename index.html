
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Fund Wars - PE/VC Career Simulator</title>
    <meta name="description" content="Navigate the cutthroat world of private equity. Start as an analyst, claw your way to Partner. AI-powered NPCs, deal mechanics, and office politics.">
    <meta name="keywords" content="private equity, venture capital, game, simulator, career, finance, investment banking">
    <meta name="author" content="Fund Wars">

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030303">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fund Wars">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fundwars.app/">
    <meta property="og:title" content="Fund Wars - PE/VC Career Simulator">
    <meta property="og:description" content="From Analyst to Partner. Navigate deals, politics, and your own sanity. Built entirely with AI.">
    <meta property="og:image" content="/icons/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fund Wars - PE/VC Career Simulator">
    <meta name="twitter:description" content="From Analyst to Partner. Built without writing a single line of code.">
    <meta name="twitter:image" content="/icons/og-image.png">

    <meta http-equiv="Permissions-Policy" content="identity-credentials-get=*">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Terminal mono for labels/numbers/UI chrome; Inter as the humanist prose
      partner for event narration, advisor dialogue, and longer copy.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Core Terminal Colors - WCAG AA tuned.
           Body text (#e6ebf2) on app bg (#0a0f14) ≈ 13.3:1.
           Muted text (#b8c1cc) on app bg (#0a0f14) ≈ 8.0:1  (was 4.4:1).
           Subtle text (#94a3b8) on app bg ≈ 5.6:1 (reserved for ambient).
        */
        --terminal-bg: #0a0f14;
        --terminal-bg-elevated: #121a24;
        --terminal-bg-card: #1a2332;
        --terminal-text: #e6ebf2;
        --terminal-text-muted: #b8c1cc;
        --terminal-text-subtle: #94a3b8;
        --terminal-border: #4b5563;
        --terminal-border-highlight: #94a3b8;

        /* Semantic color grammar — each color is a signal, not decoration.
           Cyan   -> neutral info / system chrome
           Amber  -> warning / advisor / pay-attention
           Green  -> positive outcomes / gains / success
           Red    -> negative outcomes / threats / stress
           Purple -> Machiavelli character ONLY
        */
        --terminal-accent: #fbbf24;          /* amber — warnings/advisor */
        --terminal-accent-glow: rgba(251, 191, 36, 0.45);
        --terminal-green: #34d399;           /* lifted from #10b981 for readability */
        --terminal-green-glow: rgba(52, 211, 153, 0.35);
        --terminal-red: #f87171;             /* lifted from #ef4444 for readability */
        --terminal-red-glow: rgba(248, 113, 113, 0.35);
        --terminal-blue: #60a5fa;
        --terminal-blue-glow: rgba(96, 165, 250, 0.3);
        --terminal-purple: #c084fc;          /* Machiavelli */
        --terminal-cyan: #22d3ee;

        /* Typography */
        --font-mono: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --font-prose: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

        /* Gradient Presets */
        --gradient-gold: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
        --gradient-success: linear-gradient(135deg, #34d399 0%, #059669 100%);
        --gradient-danger: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
        --gradient-dark: linear-gradient(180deg, #0d1117 0%, #030303 100%);

        /* Safe Area Insets for notched devices */
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
      }

      * {
        touch-action: manipulation;
      }

      body {
        font-family: var(--font-mono);
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--terminal-bg);
        color: var(--terminal-text);
        overflow-x: hidden;
        overflow-y: hidden; /* Let React app handle scroll, not body */

        /* Native App Feel */
        overscroll-behavior-y: none; /* Prevent pull-to-refresh but allow scroll */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Prose class for longer-form text (event narration, advisor dialogue).
         Mixed case, humanist sans, 1.5 line-height for readability. */
      .font-prose {
        font-family: var(--font-prose);
        letter-spacing: 0;
        line-height: 1.55;
      }
      .font-mono,
      .font-terminal {
        font-family: var(--font-mono);
      }

      /* Terminal Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--terminal-bg);
        border-left: 1px solid var(--terminal-border);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--terminal-border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--terminal-border-highlight);
      }

      .font-terminal {
        font-family: 'Share Tech Mono', monospace;
      }

      /* Enhanced Scanline Effect */
      .scanline {
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        position: fixed;
        pointer-events: none;
        inset: 0;
        z-index: 9999;
        opacity: 0.3;
      }

      /* Text Glow Effects */
      .text-glow {
        text-shadow: 0 0 10px var(--terminal-accent), 0 0 20px var(--terminal-accent-glow);
      }
      .text-glow-green {
        text-shadow: 0 0 10px var(--terminal-green), 0 0 20px var(--terminal-green-glow);
      }
      .text-glow-red {
        text-shadow: 0 0 10px var(--terminal-red), 0 0 20px var(--terminal-red-glow);
      }
      .text-glow-blue {
        text-shadow: 0 0 10px var(--terminal-blue), 0 0 20px var(--terminal-blue-glow);
      }

      /* Enhanced Vignette - Reduced for better visibility */
      .vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 0%, transparent 60%, rgba(0,0,0,0.2) 100%);
        pointer-events: none;
        z-index: 9998;
      }

      /* Card Styles */
      .card-glass {
        background: linear-gradient(145deg, rgba(13, 17, 23, 0.9), rgba(3, 3, 3, 0.95));
        border: 1px solid var(--terminal-border);
        backdrop-filter: blur(10px);
      }

      .card-elevated {
        background: var(--terminal-bg-card);
        border: 1px solid var(--terminal-border);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
      }

      /* Animations */
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 5px var(--terminal-accent-glow); }
        50% { box-shadow: 0 0 20px var(--terminal-accent-glow), 0 0 30px var(--terminal-accent-glow); }
      }

      @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      @keyframes slide-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes border-glow {
        0%, 100% { border-color: var(--terminal-border); }
        50% { border-color: var(--terminal-accent); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .animate-slide-in { animation: slide-in 0.3s ease-out; }
      .animate-slide-up { animation: slide-up 0.3s ease-out; }
      .animate-fade-in { animation: fade-in 0.2s ease-out; }
      .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .animate-border-glow { animation: border-glow 2s ease-in-out infinite; }
      .animate-float { animation: float 3s ease-in-out infinite; }

      .shimmer-bg {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }

      /* Button Enhancements */
      .btn-terminal {
        position: relative;
        overflow: hidden;
        transition: all 0.2s ease;
      }

      .btn-terminal::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .btn-terminal:hover::before {
        opacity: 1;
      }

      .btn-terminal:active {
        transform: translateY(1px);
      }

      /* Focus Styles — always visible on keyboard nav, subtle on mouse click.
         Used by .terminal-focus and is the app-wide default for buttons/links. */
      .focus-ring:focus-visible,
      *:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--terminal-bg), 0 0 0 4px var(--terminal-cyan);
      }
      button:focus-visible,
      a:focus-visible,
      [role="button"]:focus-visible {
        outline: none;
      }

      /* Gradient Borders */
      .border-gradient {
        position: relative;
        background: var(--terminal-bg-card);
      }

      .border-gradient::before {
        content: '';
        position: absolute;
        inset: 0;
        padding: 1px;
        background: linear-gradient(135deg, var(--terminal-accent), var(--terminal-green));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        border-radius: inherit;
        pointer-events: none;
      }

      /* Status Indicators */
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .status-dot.online {
        background: var(--terminal-green);
        box-shadow: 0 0 10px var(--terminal-green-glow);
      }

      .status-dot.warning {
        background: var(--terminal-accent);
        box-shadow: 0 0 10px var(--terminal-accent-glow);
      }

      .status-dot.danger {
        background: var(--terminal-red);
        box-shadow: 0 0 10px var(--terminal-red-glow);
      }

      /* Dividers */
      .divider-gradient {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--terminal-border), transparent);
      }

      /* Selection */
      ::selection {
        background: var(--terminal-accent);
        color: var(--terminal-bg);
      }

      /* Mobile Typography - ensure readability on small screens */
      @media (max-width: 768px) {
        .font-mono {
          font-size: max(13px, 0.8125rem);
          line-height: 1.6;
        }
      }

      /* Active-decision spotlight — used on the dominant event card so the
         player's eye has somewhere to land. Subtle, not a seizure. */
      @keyframes spotlight-pulse {
        0%, 100% {
          box-shadow:
            0 0 0 1px rgba(251, 191, 36, 0.35),
            0 0 22px rgba(251, 191, 36, 0.18),
            0 20px 40px rgba(0, 0, 0, 0.45);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(251, 191, 36, 0.6),
            0 0 32px rgba(251, 191, 36, 0.32),
            0 22px 44px rgba(0, 0, 0, 0.5);
        }
      }
      .spotlight-glow {
        animation: spotlight-pulse 3.2s ease-in-out infinite;
      }

      /* Burnout alert banner — full-width urgency. */
      @keyframes burnout-flash {
        0%, 100% { background-color: rgba(248, 113, 113, 0.18); }
        50%      { background-color: rgba(248, 113, 113, 0.32); }
      }
      .burnout-alert {
        animation: burnout-flash 1.6s ease-in-out infinite;
      }

      /* Respect OS-level reduced motion — disables non-essential motion
         (pulse/glow/shimmer/bounce) while keeping layout transitions snappy. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .spotlight-glow,
        .burnout-alert {
          animation: none !important;
        }
        .animate-pulse,
        .animate-pulse-glow,
        .animate-bounce,
        .animate-float,
        .animate-border-glow,
        .shimmer-bg {
          animation: none !important;
        }
        .scanline,
        .vignette {
          display: none !important;
        }
      }

      /* Safe Area Utility Classes */
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .mt-safe { margin-top: env(safe-area-inset-top, 0px); }
      .mb-safe { margin-bottom: env(safe-area-inset-bottom, 0px); }

      /* Ensure bottom nav doesn't get hidden behind home indicator */
      .bottom-nav-safe {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="scanline"></div>
    <div class="vignette"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
